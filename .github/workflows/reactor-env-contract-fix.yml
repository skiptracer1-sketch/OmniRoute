name: Reactor Env Contract Fix

on:
  push:
    branches:
      - release/v3.8.50
    paths:
      - .github/workflows/reactor-env-contract-fix.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair Reactor environment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v3.8.50
          persist-credentials: true
          fetch-depth: 0

      - name: Add Reactor environment variables to canonical docs
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('.env.example'); t=p.read_text(); b='\\n\\n# Reactor Native Integration\\n# Server-only Reactor API key used to mint short-lived model-scoped tokens.\\n# REACTOR_API_KEY=\\n# Reactor token endpoint; defaults to https://api.reactor.inc/tokens\\n# REACTOR_TOKEN_ENDPOINT=https://api.reactor.inc/tokens\\n# Maximum sessions per short-lived token; default 2, valid range 1-10.\\n# REACTOR_MAX_SESSIONS_PER_TOKEN=2\\n'; p.write_text(t.rstrip()+b+'\\n') if 'REACTOR_API_KEY=' not in t else None"
          python -c "from pathlib import Path; p=Path('docs/reference/ENVIRONMENT.md'); t=p.read_text(); b='\\n\\n## Reactor Native Integration\\n\\n`REACTOR_API_KEY` — Optional server-only Reactor credential used to mint short-lived, model-scoped tokens. Never expose it to browser code, responses, or logs.\\n\\n`REACTOR_TOKEN_ENDPOINT` — Optional token broker endpoint override. Defaults to https://api.reactor.inc/tokens.\\n\\n`REACTOR_MAX_SESSIONS_PER_TOKEN` — Optional maximum sessions authorized by each minted token. Defaults to 2 and is clamped to 1–10.\\n'; p.write_text(t.rstrip()+b+'\\n') if '`REACTOR_API_KEY`' not in t else None"

      - name: Verify strict environment documentation contract
        run: node scripts/check/check-env-doc-sync.mjs

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Environment contract already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example docs/reference/ENVIRONMENT.md
          git commit -m "docs: register Reactor environment variables"
          git push origin HEAD:release/v3.8.50
